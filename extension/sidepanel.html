<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ExternalCall</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true">/</span>
        <div class="brand-text">
          <h1>ExternalCall</h1>
          <p id="companion-line" class="hint">Connecting</p>
        </div>
      </div>
      <div class="top-right">
        <button id="reload-button" class="ghost" type="button"
          title="Reload the extension. Fixes stale downloads not being captured.">Reload</button>
        <span id="health" class="dot" title="Companion status"></span>
      </div>
    </header>

    <main>
      <!-- Two lists and nothing else. Calls that need something, then calls
           that are over. Every row opens where it sits. -->
      <section class="card" id="now-card">
        <div class="card-head">
          <h2>In flight</h2>
          <span id="now-count" class="pill"></span>
        </div>
        <ul id="now" class="calls"></ul>
        <p id="now-empty" class="hint" hidden>No call is prepared or running.</p>
      </section>

      <section class="card" id="past-card" hidden>
        <div class="card-head">
          <h2>Previous</h2>
          <span id="past-count" class="pill"></span>
        </div>
        <ul id="past" class="calls"></ul>
      </section>

      <!-- Text the extension has that the page would not take: a correction
           round, or a launch line that could not be typed. -->
      <section class="card" id="prompt-card" hidden>
        <div class="card-head">
          <h2>Prompt to send</h2>
          <button id="copy-prompt" class="ghost" type="button">Copy</button>
        </div>
        <p class="hint">Review it in the conversation, then click Send.</p>
        <pre id="prompt-text" class="code"></pre>
      </section>

      <p id="download-failure" class="warn" hidden></p>
      <p id="error" class="error" hidden></p>
    </main>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
